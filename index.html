<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Site</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@1,100&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-start: #00031f;
    --bg-end: #000117;
    --title-bar: #00021f;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    min-height: 100vh;
    background-color: var(--bg-start);
    animation: bgShift 2.5s ease-in-out forwards;
  }

  @keyframes bgShift {
    from { background-color: var(--bg-start); }
    to { background-color: var(--bg-end); }
  }

  .title-bar {
    width: 100%;
    height: 160px;
    background-color: var(--title-bar);
    display: flex;
    align-items: center;
    padding-left: 24px;
  }

  .title-text {
    color: #ffffff;
    font-family: 'DM Sans', Arial, Helvetica, sans-serif;
    font-size: 90px;
    line-height: 1;
    font-weight: 100;
    font-style: italic;
    opacity: 0;
    animation: fadeIn 0.6s ease-in-out forwards;
    animation-delay: 0.3s;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* Scrollbar styling */
  html {
    scrollbar-color: #039BE5 transparent;
    scrollbar-width: thin;
  }

  ::-webkit-scrollbar {
    width: 14px;
  }

  ::-webkit-scrollbar-track {
    background: transparent;
  }

  ::-webkit-scrollbar-thumb {
    background-color: #039BE5;
    border-radius: 8px;
    border: 3px solid transparent;
    background-clip: padding-box;
  }

  .spacer {
    height: 1500px;
  }

  .section-label {
    display: block;
    text-align: center;
    margin: 60px auto 0;
    color: #ffffff;
    font-family: 'DM Sans', Arial, Helvetica, sans-serif;
    font-weight: 100;
    font-style: italic;
    font-size: 34px;
  }

  .download-btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 300px;
    margin: 20px auto 0;
    padding: 22px 28px;
    background-color: #030a4d;
    color: #ffffff;
    border: 4px solid #000000;
    border-radius: 10px;
    font-family: 'DM Sans', Arial, Helvetica, sans-serif;
    font-size: 26px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.3s ease, background-color 0.2s ease;
    transform: scale(1) rotate(0deg);
  }

  .download-btn:hover {
    background-color: #0a1466;
    transform: scale(1.15) rotate(-5deg);
  }

  .download-btn::before,
  .download-btn::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 10px;
    border: 4px solid;
    opacity: 0;
    pointer-events: none;
  }

  .download-btn::before {
    border-color: #039BE5;
  }

  .download-btn::after {
    border-color: #7FD8FF;
  }

  .download-btn:hover::before {
    animation: shockwave 1.1s ease-out infinite;
  }

  .download-btn:hover::after {
    animation: shockwave 1.1s ease-out infinite;
    animation-delay: 0.55s;
  }

  @keyframes shockwave {
    0% {
      transform: scale(1);
      opacity: 0.9;
    }
    50% {
      opacity: 0.6;
    }
    100% {
      transform: scale(1.9);
      opacity: 0;
    }
  }
</style>
</head>
<body>
  <div class="title-bar">
    <span class="title-text">Zeppy's Vault</span>
  </div>
  <span class="section-label">Zeppy's Schoolhouse</span>
  <a href="Zeppy's%20Schoolhouse%20V2.zip" download class="download-btn">Download</a>
  <div class="spacer"></div>
</body>
